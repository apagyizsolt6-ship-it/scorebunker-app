name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Flutter project structure
        run: |
          flutter create . --project-name scorebunker_app --org com.scorebunker
          echo "Flutter project structure generated"

      - name: Add INTERNET permission
        run: |
          # Biztosan beszúrjuk az INTERNET permission-t a <manifest> után
          if ! grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml; then
            sed -i 's|<manifest[^>]*>|&\n    <uses-permission android:name="android.permission.INTERNET"/>|' android/app/src/main/AndroidManifest.xml
          fi
          echo "=== AndroidManifest.xml (permission check) ==="
          grep -n "INTERNET\|<manifest\|<application" android/app/src/main/AndroidManifest.xml || true

      - name: Enable core library desugaring (required by flutter_local_notifications)
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            # Enable desugaring
            if ! grep -q "isCoreLibraryDesugaringEnabled" android/app/build.gradle.kts; then
              sed -i '/compileOptions {/a\        isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
            fi

            # Add dependency
            if ! grep -q "desugar_jdk_libs" android/app/build.gradle.kts; then
              if grep -q "dependencies {" android/app/build.gradle.kts; then
                sed -i '/dependencies {/a\    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' android/app/build.gradle.kts
              else
                echo -e "\ndependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.1.4\")\n}" >> android/app/build.gradle.kts
              fi
            fi
            echo "Desugaring enabled in build.gradle.kts"
            cat android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            if ! grep -q "coreLibraryDesugaringEnabled" android/app/build.gradle; then
              sed -i '/compileOptions {/a\        coreLibraryDesugaringEnabled true' android/app/build.gradle
            fi
            if ! grep -q "desugar_jdk_libs" android/app/build.gradle; then
              if grep -q "dependencies {" android/app/build.gradle; then
                sed -i '/dependencies {/a\    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"' android/app/build.gradle
              else
                echo -e "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}" >> android/app/build.gradle
              fi
            fi
            echo "Desugaring enabled in build.gradle"
          else
            echo "ERROR: No build.gradle(.kts) found!"
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: scorebunker-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
