
name: Build Apisccores APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: apisccores-apk-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Generate Android project
        run: flutter create --platforms=android .

      - name: Configure Android project
        run: python3 tools/patch_android.py

      - name: Verify Android files
        run: |
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts
          test -f android/settings.gradle || test -f android/settings.gradle.kts
          echo "Android project successfully generated."

      - name: Flutter version
        run: flutter --version

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Release APK
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "APK build attempt: $attempt"

            if flutter build apk --release \
              --build-number=129 \
              --dart-define=BUILD_NUMBER=129; then
              echo "APK build successful"
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              wait_time=$((attempt * 30))
              echo "Waiting ${wait_time} seconds before retry..."
              sleep "$wait_time"
            fi
          done

          echo "APK build failed after 3 attempts."
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apisccores-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
