name: scorebunker_app
description: APISCORES – élő eredmények, tabellák, trendek
publish_to: 'none'
version: 1.4.0+4

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  intl: ^0.19.0
  google_fonts: ^6.2.1
  flutter_riverpod: ^2.5.1
  cached_network_image: ^3.4.1
  shared_preferences: ^2.3.2
  web_socket_channel: ^3.0.1
  path_provider: ^2.1.4
  flutter_local_notifications: 17.2.4
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#1A73E8"
  adaptive_icon_foreground: "assets/icon_fg.png"

flutter:
  uses-material-design: true
